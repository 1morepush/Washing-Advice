name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing useful left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wardrobe-core:
    name: wardrobe_core (analyze, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wardrobe_core

    steps:
      - uses: actions/checkout@v4

      # The core is pure Dart with no Flutter dependency, so the Dart SDK alone
      # runs the entire suite — no Flutter, no Android SDK, no emulator.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test example

      - name: Analyze
        # Anything the analyzer reports at all is a failure here: the domain is
        # the part of the system that cannot afford to be subtly wrong.
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Test
        run: dart test --reporter=expanded

      - name: Run the sorting demo
        # Guards against the engine compiling and passing its unit tests while
        # throwing on a realistic end-to-end pile.
        run: dart run example/sort_demo.dart

  app:
    name: app (analyze, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # Flutter, not bare Dart: this package depends on the Flutter SDK. It
      # bundles Dart, so it would also serve the core's job — that job is kept
      # on plain Dart deliberately, as a standing check that the domain has not
      # quietly grown a Flutter dependency.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify generated code is current
        # Drift's output is committed so the repository analyzes without a
        # build step. Regenerating and diffing is what stops it going stale
        # against a schema change nobody re-ran the generator for.
        run: |
          dart run build_runner build
          git diff --exit-code lib/data/drift/database.g.dart

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        # The end-to-end sync suite is excluded here and run in its own job:
        # it needs Python and uv, which this job deliberately does not install.
        run: flutter test --reporter=expanded --exclude-tags e2e

  sync-e2e:
    # The cross-language contract, exercised rather than assumed. Both halves
    # of sync pass their own unit tests while the wire between them is broken —
    # a renamed field, a timestamp one side cannot parse, a cursor that skips a
    # record. This job is the only place that would notice.
    name: sync end to end (Dart client against the real server)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Matched to the server job for the reason documented there.
          python-version: "3.11"

      - name: Install server dependencies
        working-directory: server
        run: uv sync --group dev --frozen

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Test
        working-directory: app
        # Fails rather than skips if uv is somehow absent: a silently skipped
        # integration test verifies nothing, and this job exists only for it.
        run: |
          uv --version
          flutter test test/sync_e2e_test.dart --reporter=expanded

  server:
    name: server (lint, types, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Pinned to the floor in `requires-python`, and matched by
          # `server/.python-version` so a developer gets the same interpreter.
          #
          # Without this uv takes whatever the runner happens to ship, and the
          # lockfile then resolves a *different dependency set* — numpy is
          # 2.4.6 below 3.12 and 2.5.1 at or above it, and the newer stubs use
          # syntax mypy rejects when targeting the version this project
          # actually supports. CI was testing something no developer runs.
          #
          # Pinning to the oldest supported version rather than the newest is
          # deliberate: it is the only way to catch newer syntax creeping in.
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # No GEMINI_API_KEY is set anywhere in this job, and that is deliberate:
      # the default provider is the deterministic fake, so the whole suite must
      # pass with no credentials. A suite that needs a billing account is one
      # nobody outside the project can run.
      - name: Lint
        run: uv run ruff check app tests

      - name: Verify formatting
        run: uv run ruff format --check app tests

      - name: Type check
        run: uv run mypy app

      - name: Test
        run: uv run pytest -q
