<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Washing Advice</title>
  <!--
    What GitHub Pages serves for a path that does not exist.

    The one that matters is `v/<version>/`: a version that has been dropped
    from the store since somebody chose it. Their pin would otherwise send
    them to a dead page on every launch, with nothing on it to fix that. So
    this clears the pin and goes to the newest version. Any other missing path
    gets the same page, minus the clearing, and a link home.

    Written without a <base> or any relative URL: Pages serves this page at the
    address that was missing, so relative paths would resolve against that.
  -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 32px 16px;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef4f8;
      color: #0c1620;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0c1620; color: #eef4f8; }
    }
    main { max-width: 32rem; margin: 0 auto; }
    a { color: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>That page is not here</h1>
    <p id="why">There is nothing at this address.</p>
    <p><a id="home" href="/">Open Washing Advice</a></p>
  </main>
  <script>
    (function () {
      var match = location.pathname.match(/^(.*\/)v\/[^\/]+\/.*$/);
      var home = match ? match[1] : location.pathname.replace(/[^\/]*$/, '');
      document.getElementById('home').setAttribute('href', home + '?latest=1');
      if (!match) return;
      document.getElementById('why').textContent =
        'That earlier version is no longer kept. Opening the newest one…';
      try { localStorage.removeItem('washingAdvice.pinnedVersion'); } catch (e) {}
      location.replace(home + '?latest=1');
    })();
  </script>
</body>
</html>
