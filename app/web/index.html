<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="An AI wardrobe and laundry assistant: photograph your clothes, scan their care labels, and get told exactly which loads to run.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!--
    Both spellings. The standard one above is what Flutter's template emits and
    what puts the app in standalone mode; the Apple-prefixed one is what Safari
    requires before it will read the status bar style below at all.
  -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    iOS offers exactly three status bar styles for an installed web app, and
    none of them follows the page's theme:

      default           white background, dark text
      black             black background, light text
      black-translucent light text over the page, which must then extend under
                        the notch itself

    `default` is the white strip that sat above this app's dark theme and read
    as a rendering fault. `black-translucent` cannot work here: extending under
    the notch needs `viewport-fit=cover`, and Flutter's engine deletes any
    viewport tag this file provides and injects its own without it — and even
    with it, Flutter web reports no safe-area insets, so the app bar would draw
    beneath the clock. Its always-light text would also be invisible against a
    light theme.

    So `black`: the one static choice that is never illegible and never looks
    broken. It is exactly right in the dark theme and a deliberate-looking dark
    strip in the light one.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Washing Advice">
  <!--
    Two values, so the browser chrome follows the theme the app is actually
    rendering. A single fixed colour is wrong half the time: this app follows
    the system, because a laundry app is used in a utility room at night as
    often as in daylight.
  -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9ff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111318">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Washing Advice</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The colour behind the app before Flutter has painted anything, and the
    colour of an overscroll. Unset, both are white, so opening the installed
    app in the dark theme began with a white flash — the same wrong-colour
    problem as the status bar, a few hundred milliseconds earlier.

    These match `AppTheme`'s surface in each brightness. They are only ever
    visible in that first moment: Flutter's engine pins the body and paints
    the scaffold over all of it.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #f9f9ff;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #111318;
      }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
