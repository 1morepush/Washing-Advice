<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="An AI wardrobe and laundry assistant: photograph your clothes, scan their care labels, and get told exactly which loads to run.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!--
    `default`, not `black-translucent`. Translucent asks the page to extend
    under the status bar, which only works if the page knows where the notch
    is — and that needs `viewport-fit=cover`, which Flutter's engine does not
    put in the viewport it injects. The result was the status bar sitting on a
    strip that ignored the app's own light/dark theme.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Washing Advice">
  <!--
    Two values, so the browser chrome follows the theme the app is actually
    rendering. A single fixed colour is wrong half the time: this app follows
    the system, because a laundry app is used in a utility room at night as
    often as in daylight.
  -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9ff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111318">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Washing Advice</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
