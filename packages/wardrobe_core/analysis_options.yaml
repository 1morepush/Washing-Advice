analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # The domain is the part of the system we cannot afford to get subtly wrong,
    # so anything that hints at an unhandled case is an error, not a suggestion.
    missing_return: error
    dead_code: error
    unused_import: error
    unused_local_variable: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_returning_null_for_void
    - cancel_subscriptions
    - collection_methods_unrelated_type
    - directives_ordering
    - exhaustive_cases
    - prefer_final_locals
    - prefer_single_quotes
    # `require_trailing_commas` is deliberately omitted: it predates Dart's
    # current formatter, which decides trailing commas itself, so enabling both
    # makes `dart format` and `dart analyze` disagree permanently.
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_parenthesis
    - use_super_parameters
