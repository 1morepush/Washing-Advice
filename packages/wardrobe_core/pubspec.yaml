name: wardrobe_core
description: >-
  Pure-Dart domain core for the Washing Advice wardrobe and laundry assistant.
  Contains the care model, laundry sorting engine, machine translation and item
  matching. Deliberately free of Flutter and of all runtime dependencies so it
  can be exercised anywhere a Dart VM runs.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0

# One runtime dependency, and only for the backup file: a zip has to be read
# as well as written, and reading deflate is not something to reimplement. The
# rest of the domain is still dependency-free (see
# docs/adr/0001-pure-dart-domain-core.md, and its amendment). `archive` is pure
# Dart, so the core still runs anywhere a Dart VM does, the browser included.
dependencies:
  archive: ^4.6.0

dev_dependencies:
  test: ^1.25.0
